<body>
  <a class="skip" href="#app">Skip to the assessment</a>

  <header class="topbar">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3c3 5-1 6 1 9 1.4 2.1 4-.2 4 3.4C21 19 19 21 16 21s-5-2.4-5-5.6C11 11 15 9 16 3z" fill="#e0912f"/>

  <!-- Cache-busting for a site with no build step. GitHub Pages serves assets
       with a ten-minute cache, so without this a redeploy can leave a visitor
       running a mixed graph of old and new modules. Relative specifiers inside
       the modules resolve to these same URLs, so one version covers the whole
       graph. BUMP THIS whenever a module changes. -->
  <script type="importmap">
  {
    "imports": {
      "./assets/app.js": "./assets/app.js?v=15",
      "./assets/views.js": "./assets/views.js?v=15",
      "./assets/data.js": "./assets/data.js?v=15",
      "./assets/scoring.js": "./assets/scoring.js?v=15",
      "./assets/radar.js": "./assets/radar.js?v=15",
      "./assets/capture.js": "./assets/capture.js?v=15",
      "./assets/export-png.js": "./assets/export-png.js?v=15"
    }
  }
  </script>
  <script type="module" src="./assets/app.js?v=15"></script>
</body>
</html>
